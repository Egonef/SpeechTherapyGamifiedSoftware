<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Análisis — TFG</title>
        <link rel="stylesheet" href="../common/css/base.css">
        <link rel="stylesheet" href="css/dashboard.css">
    </head>
    <body>
        <main id="analysisDashboard">

            <menu id="sidebarMenu">


                <a href="../../index.html" data-intl="menu.home">Inicio</a>
                
                <div class="dropdownContainer">
                    <h4 id="dropdownTitle" >Selección de paciente:</h4>
                    <select class="dropdown">
                        <option value="" disabled selected data-intl="menu.selectPatient">Seleccionar Paciente</option>
                        <option value="General">General</option>
                        <option value="Paciente1">Paciente 1</option>
                        <option value="Paciente2">Paciente 2</option>
                    </select>
                </div>

                <button id="overviewBtn" class="sidebarEntry" data-intl="menu.overview">Visión General</button>
                <button id="dataTableBtn" class="sidebarEntry" data-intl="menu.dataTable">Tabla de Datos</button>
            </menu>

            <section id="analysisContent">
                <h1 data-intl="analysis.title">Dashboard de Análisis</h1>
                <p data-intl="analysis.summary">Resumen de resultados</p>

                <canvas id="progressChart" width="400" height="200"></canvas>

            </section>
            
            
        </main>
        <script src="js/dashboard.js"></script>
    </body>
</html>
